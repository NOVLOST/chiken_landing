<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Домашние яйца</title>
    <meta name="description" content="Страница не найдена. Вернитесь на главную и закажите свежие домашние яйца с доставкой на дом.">
    <meta name="robots" content="noindex, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Базовые стили лендинга (кнопки, контейнер, шрифты) -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Стили страницы ошибки -->
    <link rel="stylesheet" href="css/error.css">
</head>
<body>

    <main class="error-page">
        <div class="container">
            <div class="error-content">

                <div class="error-eggs" aria-hidden="true">
                    <span class="error-digit">4</span>
                    <div class="error-egg">
                        <i class="fas fa-egg"></i>
                    </div>
                    <span class="error-digit">4</span>
                </div>

                <h1>Упс! Эта страница укатилась…</h1>
                <p class="error-subtitle">
                    Как яйцо со стола. Запрашиваемая страница не найдена,
                    была перемещена или никогда не существовала.
                </p>

                <div class="error-actions">
                    <a href="index.html" class="cta-button">
                        <i class="fas fa-home"></i> На главную
                    </a>
                    <a href="tel:+79999999999" class="error-phone">
                        <i class="fas fa-phone-alt"></i> +7 (999) 999-99-99
                    </a>
                </div>

                <div class="error-hint">
                    <p><i class="fas fa-egg"></i> А пока вы здесь — у нас всегда есть свежие домашние яйца с доставкой!</p>
                    <a href="index.html" class="error-link">
                        Перейти к заказу <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
